name: Build and Deploy to F-Droid

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-phone-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy to F-Droid Repository
        if: github.ref == 'refs/heads/main'
        env:
          FDROID_TOKEN: ${{ secrets.FDROID_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone InledGroup/fdroid-repo
          git clone https://x-access-token:${FDROID_TOKEN}@github.com/InledGroup/fdroid-repo.git fdroid-target || {
            echo "Failed to clone fdroid-repo with token, check secrets.FDROID_DEPLOY_TOKEN"
            exit 0
          }
          
          mkdir -p fdroid-target/repo
          cp app/build/outputs/apk/debug/app-debug.apk fdroid-target/repo/pulsar-phone.apk
          
          cd fdroid-target
          git add repo/pulsar-phone.apk
          if git diff --staged --quiet; then
            echo "No changes in APK"
          else
            git commit -m "build(fdroid): update pulsar-phone apk from CI [skip ci]"
            git push origin main
          fi
